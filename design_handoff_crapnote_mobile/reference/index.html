<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Crapnote — Mobile pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #DDD7CD; font-family: -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  *::-webkit-scrollbar { display: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
const { useState } = React;

const sampleNotes = [
  { title: '2026-05-05 07:02:07 — Tuesday', date: '5 May · 07:02', preview: 'Standup notes. Followups for Adi about the migration. Don\'t forget to ping ops.', pinned: true, starred: false },
  { title: 'Issues so far', date: '4 May · 21:08', preview: 'Tool bars and buttons of all types are too small — possibly in wrong place. Swipe gestures on note list…', pinned: false, starred: true },
  { title: 'Bread starter — week 3', date: '3 May · 09:14', preview: '60g rye, 60g water, 12h at 24°. Smells right. Doubles in 5h. Use Tipo 0 next bake.', pinned: false, starred: false },
  { title: 'Books to read', date: '1 May · 11:40', preview: 'Annihilation. Pachinko. The Mezzanine. Anything by Le Guin I haven\'t read.', pinned: false, starred: false },
  { title: 'Apartment hunt', date: '28 Apr · 18:22', preview: 'Northcote 2br · 1.6km from work · garden share · agent calls Tuesday', pinned: false, starred: false },
];

function App() {
  const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
    "toolbarMode": "full",
    "leftSwipeAction": "archive_delete",
    "showSync": true
  }/*EDITMODE-END*/;
  const [tweaks, setTweak] = useTweaks(TWEAKS_DEFAULTS);

  return (
    <>
      <DesignCanvas title="Crapnote — Mobile pass" subtitle="Light + dark · gestures · single-row toolbar · clean app-bar">

        {/* ── Note list ───────────────────────────── */}
        <DCSection id="list" title="Note list — primary">
          <DCArtboard id="list-default" label="Default" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes}/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-pulling" label="Pull-to-sync" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes} state="pulling"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-leftswipe" label="Swipe left → archive / delete" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes} state="left-swipe"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-rightswipe" label="Swipe right → pin / star" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes} state="right-swipe"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-search" label="Searching" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes.slice(0,2)} state="searching"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-tags" label="Tags tab" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes} state="tags-tab"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-offline" label="Offline state" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes} syncStatus="offline"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-pending" label="Not synced" width={402} height={874}>
            <IOSDevice><NoteList t={cnTokens(false)} notes={sampleNotes} syncStatus="pending"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="list-dark" label="Dark" width={402} height={874}>
            <IOSDevice dark><NoteList t={cnTokens(true)} dark notes={sampleNotes}/></IOSDevice>
          </DCArtboard>
        </DCSection>

        {/* ── Note edit ───────────────────────────── */}
        <DCSection id="edit" title="Note edit">
          <DCArtboard id="edit-reading" label="Reading (no toolbar)" width={402} height={874}>
            <IOSDevice><NoteEdit t={cnTokens(false)} state="reading"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="edit-editing" label="Editing — full toolbar above keyboard" width={402} height={874}>
            <IOSDevice keyboard><NoteEdit t={cnTokens(false)} state="editing" toolbarMode="full"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="edit-markdown" label="Editing — markdown shortcuts" width={402} height={874}>
            <IOSDevice keyboard><NoteEdit t={cnTokens(false)} state="editing" toolbarMode="markdown"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="edit-menu" label="⋯ Action menu" width={402} height={874}>
            <IOSDevice><NoteEdit t={cnTokens(false)} state="menu"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="edit-tags" label="Tag sheet (mobile)" width={402} height={874}>
            <IOSDevice><NoteEdit t={cnTokens(false)} state="tags"/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="edit-dark" label="Editing — dark" width={402} height={874}>
            <IOSDevice dark keyboard><NoteEdit t={cnTokens(true)} dark state="editing" toolbarMode="full"/></IOSDevice>
          </DCArtboard>
        </DCSection>

        {/* ── Settings ───────────────────────────── */}
        <DCSection id="settings" title="Settings & system screens">
          <DCArtboard id="settings-light" label="Settings (no shortcuts on mobile)" width={402} height={874}>
            <IOSDevice><Settings t={cnTokens(false)}/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="settings-dark" label="Settings — dark" width={402} height={874}>
            <IOSDevice dark><Settings t={cnTokens(true)}/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="archive-empty" label="Archive — empty" width={402} height={874}>
            <IOSDevice><Archive t={cnTokens(false)} empty/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="archive-full" label="Archive — with notes" width={402} height={874}>
            <IOSDevice><Archive t={cnTokens(false)}/></IOSDevice>
          </DCArtboard>
          <DCArtboard id="users" label="User management" width={402} height={874}>
            <IOSDevice><UserManagement t={cnTokens(false)}/></IOSDevice>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Mobile pass">
        <TweakSection title="Note edit">
          <TweakRadio
            label="Formatting toolbar"
            value={tweaks.toolbarMode}
            options={[
              { value: 'full', label: 'Full' },
              { value: 'compact', label: 'Compact' },
              { value: 'markdown', label: 'MD' },
            ]}
            onChange={v => setTweak('toolbarMode', v)}
          />
        </TweakSection>
        <TweakSection title="Note list gestures">
          <TweakRadio
            label="Left-swipe reveals"
            value={tweaks.leftSwipeAction}
            options={[
              { value: 'archive_delete', label: 'Archive · Delete' },
              { value: 'archive_only', label: 'Archive only' },
            ]}
            onChange={v => setTweak('leftSwipeAction', v)}
          />
          <TweakToggle label="Pull-to-sync" value={tweaks.showSync} onChange={v => setTweak('showSync', v)}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

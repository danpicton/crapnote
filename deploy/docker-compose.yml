version: "3.9"

services:
  app:
    build: .
    ports:
      - "8080:8080"
    # Metrics port: reachable from other compose services, never published to
    # the host.
    expose:
      - "9090"
    environment:
      - PORT=8080
      - DATABASE_PATH=/data/notes.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # No default on purpose: the initial admin is seeded into the database
      # on first run, so a weak fallback would persist even after the operator
      # later sets a real password. Compose fails fast when it is unset.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set a strong admin password (seeded into the app on first run)}
      - SESSION_TTL_DAYS=${SESSION_TTL_DAYS:-7}
      # Prometheus metrics listener. Compose defaults it to :9090 — a second
      # port that is NOT published to the host, so /metrics is reachable from
      # prometheus inside the compose network and nowhere else. The public
      # port 8080 always answers 404 for /metrics.
      #
      # The default uses "-" and not ":-" on purpose: only an *unset*
      # METRICS_ADDR gets :9090, so setting METRICS_ADDR= (empty) in .env
      # turns metrics off entirely, as the README describes. With ":-" an
      # explicit empty value would be silently replaced by :9090 and the
      # operator would get a metrics listener they asked not to have.
      - METRICS_ADDR=${METRICS_ADDR-:9090}
      # Set TRUST_PROXY=1 only when a trusted reverse proxy (e.g. nginx,
      # Traefik) sits directly in front of the app; forwarded headers
      # (X-Forwarded-For/-Proto) are ignored otherwise because clients can
      # spoof them to bypass per-IP rate limits and forge audit-log IPs.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Global theme seeded on first run only; a theme picked later in the UI
      # wins. Takes the lowercase theme id, e.g. console-2001. Unset by default.
      - DEFAULT_THEME=${DEFAULT_THEME:-}
      # Auto-lock notes untouched for this many days; 0 disables the job.
      - AUTO_LOCK_DAYS=${AUTO_LOCK_DAYS:-7}
      # Image uploads: per-user storage quota (MB) and per-user upload rate.
      - IMAGE_QUOTA_MB=${IMAGE_QUOTA_MB:-100}
      - IMAGE_UPLOADS_PER_MINUTE=${IMAGE_UPLOADS_PER_MINUTE:-10}
      # Automatic lockout after repeated failed logins from one (IP, username).
      - MAX_FAILED_LOGIN_ATTEMPTS=${MAX_FAILED_LOGIN_ATTEMPTS:-5}
      - LOCKOUT_COOLDOWN_MINUTES=${LOCKOUT_COOLDOWN_MINUTES:-15}
      # Per-IP login rate limiter.
      - LOGIN_RATE_PER_MINUTE=${LOGIN_RATE_PER_MINUTE:-5}
      - LOGIN_RATE_BURST=${LOGIN_RATE_BURST:-5}
      # Per-IP rate limiter for requests carrying an Authorization header.
      - BEARER_RATE_PER_MINUTE=${BEARER_RATE_PER_MINUTE:-600}
      - BEARER_RATE_BURST=${BEARER_RATE_BURST:-300}
      # Set LOG_FORMAT=json for structured JSON logs (ingested by Loki via Alloy).
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Set LOG_LEVEL=debug|info|warn|error (default: info).
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - notes-data:/data
    # Ship container logs to Loki via the Docker Loki log driver.
    # Install driver first: docker plugin install grafana/loki-docker-driver --alias loki --grant-all-permissions
    # Then uncomment the logging block below.
    #logging:
    #  driver: loki
    #  options:
    #    loki-url: "http://loki:3100/loki/api/v1/push"
    #    loki-pipeline-stages: |
    #      - json:
    #          expressions:
    #            level: level
    #            msg: msg
    #      - labels:
    #          level:
    depends_on:
      - prometheus
      - loki

  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Scrapes /metrics from the app's metrics listener (app:9090) every 15 s.
  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d

  # ── Loki ───────────────────────────────────────────────────────────────────
  # Receives logs from Alloy and makes them queryable in Grafana.
  loki:
    image: grafana/loki:3.4.3
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # ── Alloy ──────────────────────────────────────────────────────────────────
  # Grafana Alloy tails Docker container logs and forwards them to Loki.
  alloy:
    image: grafana/alloy:v1.8.3
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Pre-configured with Prometheus and Loki data sources.
  grafana:
    image: grafana/grafana:12.0.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      # No admin/admin fallback: Grafana can read every Loki log line and
      # Prometheus metric for the stack, so compose fails fast when unset.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set a Grafana admin password}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  notes-data:
  prometheus-data:
  loki-data:
  grafana-data:

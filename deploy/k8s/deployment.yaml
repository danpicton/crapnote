apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapnote
  namespace: crapnote
  labels:
    app: crapnote
spec:
  replicas: 1  # SQLite requires single writer
  # Recreate, not the default RollingUpdate. Two reasons, both hard:
  # the PVC is ReadWriteOnce, so a surging pod cannot mount /data anywhere
  # but the old pod's node; and migrations run at startup, where they are no
  # longer purely additive (000016 drops a column). Under RollingUpdate the
  # new pod would apply that drop while the old pod still served traffic on
  # the same file, and the old binary's user queries would start failing with
  # "no such column" — an auth outage for the length of the rollout. Recreate
  # takes the old pod down first: brief downtime instead, which is the right
  # trade for a single-writer database.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crapnote
  template:
    metadata:
      labels:
        app: crapnote
    spec:
      containers:
        - name: crapnote
          image: ghcr.io/danpicton/crapnote:latest
          ports:
            - name: http
              containerPort: 8080
            # Prometheus metrics. Deliberately absent from the Service (and so
            # from the ingress) — scrape it in-cluster by pod IP or via a
            # separate headless/metrics Service.
            - name: metrics
              containerPort: 9090
          env:
            - name: PORT
              value: "8080"
            # Serve /metrics on its own listener; the public port answers 404
            # for it. Unset this to disable metrics entirely.
            #
            # Availability coupling — read before adding a sidecar. The app
            # fails fast if METRICS_ADDR cannot be bound: an operator who asks
            # for metrics must not be left believing they are exported. That is
            # deliberate, but it makes this observability-only listener a
            # startup dependency. Every container in a pod shares one network
            # namespace, so a sidecar or service-mesh proxy that also claims
            # 9090 will make the app crash-loop and serve no notes at all. If
            # you add one, give it a different port, move this listener to a
            # free one (update the metrics containerPort above to match), or
            # remove this env var to turn metrics off.
            - name: METRICS_ADDR
              value: ":9090"
            - name: DATABASE_PATH
              value: /data/notes.db
            - name: SESSION_TTL_DAYS
              value: "7"
            # Client-IP resolution. Behind an ingress controller the real
            # client address arrives in X-Forwarded-For; with TRUST_PROXY
            # off, the per-IP login rate limiter, the per-(IP, username)
            # lockout and the audit log all key on the ingress pod's address
            # instead, so one noisy client can lock out everyone and audit
            # entries name the proxy. Leave it "true" only while the app is
            # reachable solely through the ingress — a pod reachable directly
            # (port-forward, in-cluster client, NodePort) can spoof the header.
            - name: TRUST_PROXY
              value: "true"
            # Structured logs for cluster log collection; set "text" for
            # human-readable output. LOG_LEVEL: debug|info|warn|error.
            - name: LOG_FORMAT
              value: "json"
            - name: LOG_LEVEL
              value: "info"
            # Global theme seeded on first run only; a theme later chosen in
            # the UI wins. Lowercase theme id, e.g. "console-2001". Empty
            # means the client's own default is used.
            - name: DEFAULT_THEME
              value: ""
            # Auto-lock notes untouched for this many days; "0" disables it.
            - name: AUTO_LOCK_DAYS
              value: "7"
            # Image uploads: per-user quota (MB) and per-user upload rate.
            - name: IMAGE_QUOTA_MB
              value: "100"
            - name: IMAGE_UPLOADS_PER_MINUTE
              value: "10"
            # Automatic lockout after repeated failed logins from one
            # (client IP, submitted username) pair.
            - name: MAX_FAILED_LOGIN_ATTEMPTS
              value: "5"
            - name: LOCKOUT_COOLDOWN_MINUTES
              value: "15"
            # Per-IP login rate limiter.
            - name: LOGIN_RATE_PER_MINUTE
              value: "5"
            - name: LOGIN_RATE_BURST
              value: "5"
            # Per-IP rate limiter for requests with an Authorization header.
            - name: BEARER_RATE_PER_MINUTE
              value: "600"
            - name: BEARER_RATE_BURST
              value: "300"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crapnote-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crapnote-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crapnote-data
